openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Image analysis API powered by Gemini
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Image analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analyze:
    post:
      operationId: analyzeImage
      tags: [analysis]
      summary: Analyze an image
      description: Accepts an image and category, calls Gemini for analysis, stores and returns result
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AnalyzeInput"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /history:
    get:
      operationId: getHistory
      tags: [analysis]
      summary: Get analysis history
      description: Returns all past analyses ordered by most recent first
      responses:
        "200":
          description: List of analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Analysis"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AnalyzeInput:
      type: object
      required:
        - image
        - category
      properties:
        image:
          type: string
          description: The image file to analyze (binary, sent as multipart/form-data)
        category:
          type: string
          enum:
            - computer_hardware
            - mobile_device
            - general_electronics
            - other
          description: Device category for tailored analysis

    Analysis:
      type: object
      required:
        - id
        - category
        - imageData
        - analysisText
        - issues
        - suggestions
        - createdAt
      properties:
        id:
          type: integer
        category:
          type: string
          enum:
            - computer_hardware
            - mobile_device
            - general_electronics
            - other
        imageData:
          type: string
          description: Base64-encoded image data with data URI prefix
        analysisText:
          type: string
          description: Full analysis text from Gemini
        issues:
          type: array
          items:
            type: string
          description: List of identified issues
        suggestions:
          type: array
          items:
            type: string
          description: List of actionable suggestions
        relevanceScore:
          type: integer
          description: 0-100 score indicating how well the image matches the selected category
        createdAt:
          type: string
          description: ISO 8601 timestamp

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
