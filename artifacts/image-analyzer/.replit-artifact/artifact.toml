kind = "web"
previewPath = "/"
title = "Image Analyzer"
version = "1.0.0"
id = "artifacts/image-analyzer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22122

[services.development]
run = "pnpm --filter @workspace/image-analyzer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/image-analyzer", "run", "build" ]
publicDir = "artifacts/image-analyzer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22122"
BASE_PATH = "/"
